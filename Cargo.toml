[package]
name = "token-monitor-rs"
version = "0.1.0"
edition = "2021"
description = "Lightweight Rust tray & decluttered dashboard wrapper for Javis603/token-monitor with automatic game-mode pause"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
muda = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
